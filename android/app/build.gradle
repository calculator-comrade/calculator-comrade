apply plugin: 'com.android.application'

// Local signing credentials are not committed to Git.
// See android/keystore.properties.example and docs/android-release.md.
def releaseSigningFile = rootProject.file('keystore.properties')
def releaseSigning = new Properties()
def resolvedSigningPasswords = [:]
// Android Studio sync and debug builds should not require release-only secrets.
def releaseTaskRequested = gradle.startParameter.taskNames.any { task ->
    task.toLowerCase(java.util.Locale.ROOT).contains('release')
}
def environmentReferencePattern = java.util.regex.Pattern.compile('^\\$\\{env:([A-Za-z_][A-Za-z0-9_]*)\\}$')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { stream -> releaseSigning.load(stream) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { name ->
        if (!releaseSigning.getProperty(name)?.trim()) {
            throw new GradleException("Missing '${name}' in ${releaseSigningFile}")
        }
    }
    ['storePassword', 'keyPassword'].each { name ->
        def raw = releaseSigning.getProperty(name)
        def matcher = environmentReferencePattern.matcher(raw)
        if (matcher.matches()) {
            def envName = matcher.group(1)
            def secret = System.getenv(envName)
            if (!secret && releaseTaskRequested) {
                throw new GradleException("Environment variable '${envName}' for '${name}' is not set")
            }
            resolvedSigningPasswords[name] = secret ?: ''
        } else if (raw.startsWith('${env:')) {
            throw new GradleException("Invalid environment reference for '${name}' in ${releaseSigningFile}")
        } else {
            // Keep literal values supported for existing local configurations.
            resolvedSigningPasswords[name] = raw
        }
    }
    if (!rootProject.file(releaseSigning.getProperty('storeFile')).isFile()) {
        throw new GradleException("Android upload keystore not found: ${releaseSigning.getProperty('storeFile')}")
    }
}

android {
    namespace = "ru.robotmitya.comrade"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.robotmitya.comrade"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "2.0.0-rc.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningFile.isFile()) {
            release {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword resolvedSigningPasswords.storePassword
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword resolvedSigningPasswords.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningFile.isFile()) {
                signingConfig signingConfigs.release
            }
            // Enable R8 shrinking, optimization and obfuscation for native DEX code.
            minifyEnabled true
            // Native Android resource shrinking needs separate testing for runtime references.
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

