<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48.png" />
    <link rel="icon" type="image/png" sizes="72x72" href="%BASE_URL%favicon-72.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon-96.png" />
    <link rel="icon" type="image/png" sizes="144x144" href="%BASE_URL%favicon-144.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%favicon-192.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />

    <style>
      html {
        color: #ffffff;
        background: #000000;
      }

      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #000000;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      #app-startup-cover {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2147483647;

        background: #000000;
        opacity: 1;
        pointer-events: auto;

        transition: opacity 160ms ease-out;
      }

      html.app-startup-ready #app-startup-cover {
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <noscript>
      <style>
        /* The startup cover must not hide the message when JS is disabled. */
        #app-startup-cover {
          display: none;
        }

        .javascript-required {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          min-height: 100dvh;
          padding: 1.5rem;
          color: #ffffff;
          font: 16px/1.5 system-ui, sans-serif;
          text-align: center;
        }

        .javascript-required h1 {
          margin: 0 0 0.75rem;
          font-size: 1.75rem;
        }

        .javascript-required p {
          max-width: 32rem;
          margin: 0;
        }
      </style>
    </noscript>
    <title>Calculator Comrade</title>
  </head>
  <body>
    <div id="app-startup-cover" aria-hidden="true"></div>
    <div id="root">
      <noscript>
        <main class="javascript-required">
          <h1>JavaScript is required</h1>
          <p>Calculator Comrade needs JavaScript to run the calculator. Please enable JavaScript in your browser and reload this page.</p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
